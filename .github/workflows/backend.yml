name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/backend.yml'
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    env:
      AI_IDENTITY_JWKS_URL: http://localhost/.well-known/jwks.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Provider contract tests (vs OpenAPI)
        run: pytest tests/test_contract.py -q
      - name: Test (pytest)
        run: pytest --ignore=tests/test_contract.py

  identity-service:
    name: Identity service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriplan -d identity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IDENTITY_DATABASE_URL: postgresql+psycopg://nutriplan:nutriplan@localhost:5432/identity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/identity/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Validate migrations (alembic upgrade)
        run: alembic upgrade head
      - name: Provider contract tests (vs OpenAPI)
        run: pytest tests/test_contract.py -q
      - name: Test (pytest)
        run: pytest --ignore=tests/test_contract.py
      - name: Build runtime image
        run: docker build --target runtime -t nutriplan-identity:ci .
      - name: Smoke test the runtime image
        run: |
          docker run -d --name identity-smoke --network host \
            -e IDENTITY_DATABASE_URL=postgresql+psycopg://nutriplan:nutriplan@localhost:5432/identity \
            nutriplan-identity:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8081/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8081/health
          curl -fsS http://localhost:8081/metrics > /dev/null
          docker rm -f identity-smoke

  # IDN-700: prove the suite runs against a throwaway Postgres brought up by Testcontainers
  # (the QA harness), with no service container and no IDENTITY_DATABASE_URL.
  identity-testcontainers:
    name: Identity ephemeral Postgres (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    env:
      IDENTITY_TEST_DB: postgres
      # The runner is torn down after the job; skip Ryuk's privileged sidecar.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/identity/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test against an ephemeral Postgres container
        run: pytest tests/test_harness.py tests/test_auth.py tests/test_refresh.py tests/test_profile.py -q

  commerce-service:
    name: Commerce service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commerce
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriplan -d commerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMMERCE_DATABASE_URL: postgresql+psycopg://nutriplan:nutriplan@localhost:5432/commerce
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/commerce/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Validate migrations (alembic upgrade)
        run: alembic upgrade head
      - name: Test (pytest)
        run: pytest

  # COM-801: the QA harness -- the whole Commerce suite (including the seeded fixtures and an
  # integration pass through the API checked against the contract) runs against a clean, throwaway
  # Postgres brought up by Testcontainers for the run, with no service container and no
  # COMMERCE_DATABASE_URL.
  commerce-testcontainers:
    name: Commerce ephemeral Postgres (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commerce
    env:
      COMMERCE_TEST_DB: postgres
      # The runner is torn down after the job; skip Ryuk's privileged sidecar.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/commerce/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test against an ephemeral Postgres container
        run: pytest -q

  dietary-service:
    name: Dietary service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dietary
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIETARY_MONGO_URL: mongodb://localhost:27017
      DIETARY_MONGO_DB: dietary_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/dietary/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Provider contract tests (vs OpenAPI)
        run: pytest tests/test_contract.py -q
      - name: Test (pytest)
        run: pytest --ignore=tests/test_contract.py

  # DPL-701: the QA harness -- the Mongo-backed suite (repositories, schema validation, indexes, the
  # seeded fixtures and an integration pass through the API checked against the contract) runs
  # against a throwaway MongoDB brought up by Testcontainers, with no service container and no
  # DIETARY_MONGO_URL.
  dietary-testcontainers:
    name: Dietary ephemeral MongoDB (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dietary
    env:
      DIETARY_TEST_DB: mongo
      # The runner is torn down after the job; skip Ryuk's privileged sidecar.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/dietary/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test against an ephemeral MongoDB container
        run: >-
          pytest -q tests/test_harness.py tests/test_meal_plan_repository.py
          tests/test_recipe_repository.py tests/test_recipe_search_repository.py
          tests/test_schema_validation.py tests/test_recipe_schema_validation.py
          tests/test_indexes.py tests/test_recipe_indexes.py tests/test_favorite_repository.py
          tests/test_recipe_seed.py

  notification-service:
    name: Notification service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Deliberately not NOTIFICATION_REDIS_URL: this points the probe suite at a live
      # server without changing what the service itself is configured with.
      NOTIFICATION_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/notification/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pytest)
        run: pytest
      - name: Build runtime image
        run: docker build --target runtime -t nutriplan-notification:ci .
      - name: Smoke test the runtime image
        run: |
          docker run -d --name notification-smoke --network host \
            -e NOTIFICATION_REDIS_URL=redis://localhost:6379/0 \
            nutriplan-notification:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8084/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8084/health
          curl -fsS http://localhost:8084/health/ready
          docker rm -f notification-smoke
