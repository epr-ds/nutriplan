name: Chaos / Failover Tests (HRD-505)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chaos-tests/**'
      - 'services/**'
      - '.github/workflows/chaos.yml'
  pull_request:
    paths:
      - 'chaos-tests/**'
      - 'services/**'
      - '.github/workflows/chaos.yml'

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos-tests:
    name: Chaos / Failover tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai
          - commerce
          - notification
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'services/${{ matrix.service }}/requirements-dev.txt'

      - name: Install service dependencies
        run: |
          pip install -r services/${{ matrix.service }}/requirements-dev.txt
          pip install pytest

      - name: Install chaos-test dependencies
        run: pip install pytest

      - name: Run chaos tests for ${{ matrix.service }}
        run: |
          PYTHONPATH=services pytest chaos-tests/ \
            -v \
            --tb=short \
            -k "${{ matrix.service }}" \
            2>&1 || true
        working-directory: .

      - name: Run service-specific resilience tests
        run: |
          pytest services/${{ matrix.service }}/tests/ \
            -q \
            --ignore=services/${{ matrix.service }}/tests/test_contract.py \
            --tb=short \
            2>&1 || true
        working-directory: .

  chaos-integration:
    name: Chaos integration (all services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install all service dependencies
        run: |
          pip install pytest
          for service in ai commerce notification dietary identity; do
            if [ -f "services/$service/requirements-dev.txt" ]; then
              pip install -r "services/$service/requirements-dev.txt"
            fi
           done

      - name: Run all chaos tests
        run: |
          # Add repo root, service app dirs so 'from services.*.app.*' resolves
          PYTHONPATH="$(pwd):services" pytest chaos-tests/ -v --tb=short

  chaos-summary:
    name: Chaos test summary
    runs-on: ubuntu-latest
    needs: [chaos-tests, chaos-integration]
    if: always()
    steps:
      - name: Check chaos test results
        run: |
          if [ "${{ needs.chaos-tests.result }}" = "failure" ] || [ "${{ needs.chaos-integration.result }}" = "failure" ]; then
            echo "::error::Chaos tests failed"
            exit 1
          fi
          echo "All chaos tests passed"
