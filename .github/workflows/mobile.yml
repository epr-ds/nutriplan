name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Contract drift guard (KMP Identity client)
        run: |
          python -m pip install --quiet pyyaml
          python ../scripts/check_mobile_identity_contract.py
      # DPL-703: the Dietary client, its spec-derived mock and the contract must agree.
      - name: Contract drift guard (KMP Dietary client)
        run: python ../scripts/check_mobile_dietary_contract.py
      # AIA-703: the AI client, its spec-derived mock and the contract must agree.
      - name: Contract drift guard (KMP AI client)
        run: python ../scripts/check_mobile_ai_contract.py
      - name: Build shared + Android app & run tests
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --stacktrace
      - name: Static analysis (detekt)
        run: ./gradlew detekt --stacktrace

  # HRD-305 / IDN-705: Accessibility regression checks
  android-a11y:
    name: Android accessibility checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compose semantics/a11y checks (JVM, Robolectric)
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace
      - name: Run Compose UI a11y checks
        run: ./gradlew :androidApp:lintDebug --stacktrace
        env:
          # Lint includes AccessibilityCheck rules (ContentDescriptionCheck, ViewConfigurationCheck)
          ANDROID_LINT_COMPLETE: '1'

  # IDN-703: headless auth-journey E2E — register -> onboarding -> authenticated /users/me.
  # iOS runs the same journey through the shared layer but has no UI harness yet (IDN-506);
  # the failure artifact here is the JUnit report rather than a device video.
  android-e2e:
    name: Android auth E2E (headless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Auth journey E2E (JVM, Robolectric)
        run: ./gradlew :androidApp:testDebugUnitTest --tests "com.nutriplan.android.e2e.AuthJourneyE2ETest" --stacktrace
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-auth-e2e-report
          path: |
            mobile/androidApp/build/reports/tests/testDebugUnitTest
            mobile/androidApp/build/test-results/testDebugUnitTest

  # DPL-704: headless planning-journey E2E — create a plan -> add a meal -> see the nutrition.
  # The UI journey runs on the JVM (Robolectric); the same journey through the shared layer runs
  # here on the JVM and in the iOS job on the simulator. On failure the job uploads a screenshot and
  # a step-by-step trace (with every request the app made) next to the JUnit reports.
  android-planning-e2e:
    name: Android planning E2E (headless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Planning journey through the shared layer (JVM)
        run: ./gradlew :shared:testAndroidHostTest --tests "com.nutriplan.shared.e2e.PlanningJourneyTest" --stacktrace
      - name: Planning journey through the app's UI (JVM, Robolectric)
        run: ./gradlew :androidApp:testDebugUnitTest --tests "com.nutriplan.android.e2e.PlanningJourneyE2ETest" --stacktrace
      - name: Upload E2E screenshot, trace and reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-planning-e2e-report
          path: |
            mobile/androidApp/build/reports/e2e
            mobile/androidApp/build/reports/tests/testDebugUnitTest
            mobile/androidApp/build/test-results/testDebugUnitTest
            mobile/shared/build/reports/tests
            mobile/shared/build/test-results

  # AIA-705: headless AI-journey E2E -- recommend -> add to a plan -> the meal respects the user's
  # allergies and calorie target. Same shape as the planning E2E: the UI journey on the JVM
  # (Robolectric), the shared-layer journey here and on the iOS simulator, and a screenshot plus a
  # step-by-step trace uploaded on failure.
  android-ai-e2e:
    name: Android AI E2E (headless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: AI journey through the shared layer (JVM)
        run: ./gradlew :shared:testAndroidHostTest --tests "com.nutriplan.shared.e2e.AiJourneyTest" --stacktrace
      - name: AI journey through the app's UI (JVM, Robolectric)
        run: ./gradlew :androidApp:testDebugUnitTest --tests "com.nutriplan.android.e2e.AiJourneyE2ETest" --stacktrace
      - name: Upload E2E screenshot, trace and reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ai-e2e-report
          path: |
            mobile/androidApp/build/reports/e2e
            mobile/androidApp/build/reports/tests/testDebugUnitTest
            mobile/androidApp/build/test-results/testDebugUnitTest
            mobile/shared/build/reports/tests
            mobile/shared/build/test-results

  android-release:
    name: Android release build (Play App Signing)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # HRD-701: Play App Signing — upload key from vault (never in repo).
      # Required env vars: KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: mobile/androidApp/build/outputs/apk/release/*.apk

  # HRD-602: Upload Crashlytics symbols for Android.
  crashlytics-android:
    name: Crashlytics symbol upload (Android)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK (with symbol generation)
        run: ./gradlew :androidApp:assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # HRD-602: Upload symbols to Firebase Crashlytics.
      - name: Upload symbols to Crashlytics
        uses: firebase/firebase-github-actions@release/crashlytics-symbol-generator
        with:
          # Service account key is stored in GitHub Secrets as JSON.
          service_env_var: FIREBASE_SERVICE_ACCOUNT

  ios-framework:
    name: iOS shared framework
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Link shared iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

  # DPL-704: the planning journey through the shared layer on the iOS simulator (the same
  # view-models the SwiftUI screens use). There is no SwiftUI UI harness yet, so the iOS half runs
  # one level below the screens; the failure artifact is the test report.
  ios-planning-e2e:
    name: iOS planning E2E (headless, shared layer)
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Planning journey on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --tests "com.nutriplan.shared.e2e.PlanningJourneyTest" --stacktrace
      - name: Upload iOS E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-planning-e2e-report
          path: |
            mobile/shared/build/reports/tests
            mobile/shared/build/test-results

  # AIA-705: the AI journey through the shared layer on the iOS simulator.
  ios-ai-e2e:
    name: iOS AI E2E (headless, shared layer)
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: AI journey on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --tests "com.nutriplan.shared.e2e.AiJourneyTest" --stacktrace
      - name: Upload iOS E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ai-e2e-report
          path: |
            mobile/shared/build/reports/tests
            mobile/shared/build/test-results

  # HRD-602: Upload dSYM symbols for iOS crash reporting.
  ios-symbols:
    name: iOS symbol upload (dSYM)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # Build iOS framework to generate dSYM files.
      - name: Build iOS framework (with debug symbols)
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace

      # HRD-602: Upload dSYM to Firebase Crashlytics for symbolication.
      - name: Upload iOS dSYM to Crashlytics
        uses: firebase/firebase-github-actions@release/crashlytics-symbol-generator
        with:
          service_env_var: FIREBASE_SERVICE_ACCOUNT
