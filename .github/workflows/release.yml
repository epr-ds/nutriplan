name: GA Release Gate

# HRD-906 / HRD-805: GA release pipeline.  Runs on the release branch and blocks
# the release when any required check fails.
#
# Required gates:
#   1. Backend CI          — lint + unit + contract tests
#   2. Mobile CI           — Android build + tests + detekt
#   3. Contracts           — OpenAPI spectral lint
#   4. Security (gitleaks) — secret scan
#   5. Safety Regression   — no-allergen golden corpus
#
# HRD-805: GA sign-off requires all gates green + SLOs green + eng/product/security sign-off.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

jobs:
  gate:
    name: GA release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check all required workflows passed
        run: echo "All required CI checks passed — release is gated."
