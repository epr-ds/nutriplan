name: GA Release Gate

# HRD-906 / HRD-805: GA release pipeline.  Runs on the release branch and blocks
# the release when any required check fails.
#
# Required gates:
#   1. Backend CI          — lint + unit + contract tests
#   2. Mobile CI           — Android build + tests + detekt
#   3. Contracts           — OpenAPI spectral lint
#   4. Security (gitleaks) — secret scan
#   5. Safety Regression   — no-allergen golden corpus
#
# HRD-805: GA sign-off requires all gates green + SLOs green + eng/product/security sign-off.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

jobs:
  gate:
    name: GA release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check all required workflows passed
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const requiredChecks = [
              'Backend CI',
              'Mobile CI',
              'Contracts',
              'Security (gitleaks)',
              'Safety Regression'
            ];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            console.log(`Checking required checks for ${sha}...`);

            // Fetch combined status for the commit
            const { data: status } = await github.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha
            });

            const failed = requiredChecks.filter(check => {
              const found = status.states.find(s => s.context === check);
              return !found || found.state !== 'SUCCESS';
            });

            if (failed.length > 0) {
              core.setFailed(
                `GA release gate blocked. Missing checks: ${failed.join(', ')}`
              );
            } else {
              console.log('All required CI checks passed — release is gated.');
            }
