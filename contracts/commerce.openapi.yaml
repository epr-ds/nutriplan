openapi: 3.0.3
info:
  title: NutriPlan Commerce API
  version: 1.0.0
  description: |
    Orders, fulfillment (dark kitchen / grocery), and payments for the NutriPlan Commerce
    bounded context. Currency defaults to MXN; payment methods include cards, PayPal, OXXO,
    and SPEI.
  contact:
    name: NutriPlan Team
    url: https://github.com/epr-ds/nutriplan
  license:
    name: Proprietary
    url: https://github.com/epr-ds/nutriplan/blob/main/LICENSE
servers:
  - url: https://api.nutriplan.app/commerce/v1
    description: Production
  - url: http://localhost:8083
    description: Local development
tags:
  - name: Orders
  - name: Fulfillment
  - name: Payments

paths:
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order from a meal plan
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List the current user's orders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, preparing, in_transit, delivered, cancelled]
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get order details
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: >-
        Cancels the caller's order (COM-107). When the order carried a captured payment it is
        refunded through the provider (COM-208): in full by default, or partially when the optional
        body supplies `refundAmount`. Refunds are ignored for orders that were never paid.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /webhooks/payments:
    post:
      tags: [Webhooks]
      operationId: paymentWebhook
      summary: Provider payment webhook (async settlement)
      description: >-
        Settles an order from a payment provider's asynchronous webhook (COM-206). Authenticated by
        the provider's signature over the raw request body (`X-Webhook-Signature`), not a bearer
        token, so no `BearerAuth` applies here. A verified `payment.confirmed` event confirms the
        referenced order (`pending` -> `confirmed`) and a `payment.failed` event cancels it
        (`pending` -> `cancelled`); both are idempotent, so a redelivered event is a safe no-op.
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: >-
            Hex-encoded HMAC-SHA256 of the raw request body, keyed by the shared webhook secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: Webhook accepted (or idempotently re-accepted); the order was settled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookAck'
        '400':
          $ref: '#/components/responses/InvalidSignature'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /webhooks/kitchen:
    post:
      tags: [Webhooks]
      operationId: kitchenWebhook
      summary: Kitchen status webhook (fulfilment sync)
      description: >-
        Advances an order's fulfilment state from a dark kitchen's asynchronous status webhook
        (COM-303). Authenticated by the kitchen's signature over the raw request body
        (`X-Webhook-Signature`), not a bearer token, so no `BearerAuth` applies here. A verified
        `kitchen.preparing` event advances the referenced order (`confirmed` -> `preparing`) and a
        `kitchen.dispatched` event advances it (`preparing` -> `in_transit`); both are idempotent, so
        a redelivered event is a safe no-op, while an out-of-order report is a `409`.
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: >-
            Hex-encoded HMAC-SHA256 of the raw request body, keyed by the shared webhook secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenWebhookEvent'
      responses:
        '200':
          description: Webhook accepted (or idempotently re-accepted); the order was advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenWebhookAck'
        '400':
          $ref: '#/components/responses/InvalidSignature'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /payment-methods:
    get:
      tags: [Payments]
      operationId: listPaymentMethods
      summary: List the current user's saved payment methods
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's saved payment methods, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Payments]
      operationId: savePaymentMethod
      summary: Save a tokenized payment method
      description: >-
        Stores a tokenized payment instrument for reuse at checkout (COM-207). The request carries a
        provider `token` produced by on-device tokenization; a PAN/CVV is never sent or stored. The
        stored token is never returned — the response holds only the id and display metadata.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePaymentMethodRequest'
      responses:
        '201':
          description: Payment method saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /payment-methods/{paymentMethodId}:
    delete:
      tags: [Payments]
      operationId: deletePaymentMethod
      summary: Delete a saved payment method
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentMethodId'
      responses:
        '204':
          description: Payment method deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /fulfillment/dark-kitchen/availability:
    get:
      tags: [Fulfillment]
      operationId: getDarkKitchenAvailability
      summary: Check dark-kitchen availability
      security:
        - BearerAuth: []
      parameters:
        - name: zipCode
          in: query
          required: true
          schema:
            type: string
        - name: deliveryDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Availability information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'

  /fulfillment/grocery/search:
    post:
      tags: [Fulfillment]
      operationId: searchGroceryProducts
      summary: Search products across grocery providers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrocerySearchRequest'
      responses:
        '200':
          description: Search results across providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderResponse'

  /fulfillment/grocery/providers:
    get:
      tags: [Fulfillment]
      operationId: listGroceryProviders
      summary: List available grocery providers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication is required, or the bearer token is missing/invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        The order does not exist, or is not visible to the caller. An order owned by a
        different user is deliberately reported as not found (no existence/ownership leak).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request conflicts with existing state: an illegal order transition, or an
        `Idempotency-Key` reused with a different request body (COM-209).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: >-
        The request was well-formed but failed validation or a domain precondition. Validation
        failures additionally carry a machine-readable `errors` array.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidSignature:
      description: >-
        The payment webhook signature was missing or did not match the raw request body, or the
        verified body could not be understood (COM-206). The event is not trusted and no order is
        changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional client-generated key that makes create-order safe to retry (COM-209). A repeat with
        the same key returns the original order without creating or charging again; the same key with
        a different body is a 409.
      schema:
        type: string
        maxLength: 255
    PaymentMethodId:
      name: paymentMethodId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateOrderRequest:
      type: object
      required: [mealPlanId, fulfillmentType, deliveryAddress, deliveryDate, deliveryTimeSlot]
      properties:
        mealPlanId:
          type: string
          format: uuid
        fulfillmentType:
          type: string
          enum: [dark_kitchen, grocery_delivery, pickup]
        providerId:
          type: string
          description: Required for grocery_delivery (e.g., freshbasket, walmart, chedraui)
        deliveryAddress:
          $ref: '#/components/schemas/AddressRequest'
        deliveryDate:
          type: string
          format: date
        deliveryTimeSlot:
          type: string
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodRequest'
        notes:
          type: string

    AddressRequest:
      type: object
      required: [street, city, state, zipCode, country]
      properties:
        street:
          type: string
        apartment:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        instructions:
          type: string

    PaymentMethodRequest:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          enum: [credit_card, debit_card, paypal, oxxo, spei]
        token:
          type: string

    CancelOrderRequest:
      type: object
      description: >
        Optional options for cancelling an order (COM-208). Supply `refundAmount` to request a
        *partial* refund of a paid order; omit it (or send an empty body) to refund the order in
        full. The value must be positive and no greater than the order total. Ignored when the
        order was never paid.
      properties:
        refundAmount:
          type: number
          description: Amount to refund; defaults to the full order total when omitted.

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, preparing, in_transit, delivered, cancelled]
        fulfillmentType:
          type: string
          enum: [dark_kitchen, grocery_delivery, pickup]
        provider:
          $ref: '#/components/schemas/ProviderResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        subtotal:
          $ref: '#/components/schemas/MoneyResponse'
        deliveryFee:
          $ref: '#/components/schemas/MoneyResponse'
        total:
          $ref: '#/components/schemas/MoneyResponse'
        estimatedDelivery:
          type: string
          format: date-time
        trackingUrl:
          type: string
          format: uri
        voucher:
          $ref: '#/components/schemas/VoucherResponse'
        transfer:
          $ref: '#/components/schemas/TransferResponse'
        approval:
          $ref: '#/components/schemas/ApprovalResponse'
        refund:
          $ref: '#/components/schemas/RefundResponse'

    VoucherResponse:
      type: object
      description: >
        Offline payment voucher (OXXO) issued for an asynchronous payment. Present only for a
        voucher method; the order stays `pending` until the provider confirms settlement via a
        webhook. The customer pays `amount` using `reference` before `expiresAt`.
      properties:
        reference:
          type: string
        amount:
          $ref: '#/components/schemas/MoneyResponse'
        expiresAt:
          type: string
          format: date-time
        provider:
          type: string
        barcodeUrl:
          type: string
          format: uri

    TransferResponse:
      type: object
      description: >
        Bank-transfer instructions (SPEI) issued for an asynchronous payment. Present only for a
        transfer method; the order stays `pending` until the provider confirms the transfer landed
        via a webhook. The customer transfers `amount` to the interbank `clabe` quoting `reference`
        before `expiresAt`.
      properties:
        clabe:
          type: string
        reference:
          type: string
        amount:
          $ref: '#/components/schemas/MoneyResponse'
        expiresAt:
          type: string
          format: date-time
        provider:
          type: string

    ApprovalResponse:
      type: object
      description: >
        Redirect-approval order (PayPal) created for an asynchronous payment. Present only for a
        `paypal` method; the order stays `pending` until the provider confirms the captured payment
        via a webhook. The customer is redirected to `approvalUrl` to approve paying `amount`
        before `expiresAt`; `reference` is the provider's order id.
      properties:
        approvalUrl:
          type: string
          format: uri
        reference:
          type: string
        amount:
          $ref: '#/components/schemas/MoneyResponse'
        expiresAt:
          type: string
          format: date-time
        provider:
          type: string

    RefundResponse:
      type: object
      description: >
        A refund captured when a paid order was cancelled (COM-208). Present on an order only once a
        captured payment has actually been refunded. `status` is `full` when the whole total was
        returned or `partial` otherwise, and `amount` is the exact sum refunded.
      properties:
        refundId:
          type: string
        status:
          type: string
          enum: [full, partial]
        amount:
          $ref: '#/components/schemas/MoneyResponse'
        provider:
          type: string

    SavePaymentMethodRequest:
      type: object
      description: >
        A tokenized payment instrument to save for reuse (COM-207). `token` is the durable handle
        produced by on-device tokenization; a PAN/CVV is never sent. `brand`/`last4`/`expMonth`/
        `expYear` are optional non-sensitive display metadata (cards carry it, wallets do not).
      required: [type, token]
      properties:
        type:
          type: string
          enum: [credit_card, debit_card, paypal, oxxo, spei]
        token:
          type: string
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
        expYear:
          type: integer

    PaymentMethodResponse:
      type: object
      description: >
        A saved payment method projected for display (COM-207). The stored provider token is
        deliberately never returned — only the id and non-sensitive display metadata.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [credit_card, debit_card, paypal, oxxo, spei]
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
        expYear:
          type: integer
        createdAt:
          type: string
          format: date-time

    PaymentWebhookEvent:
      type: object
      description: >
        A payment provider's asynchronous settlement webhook (COM-206). `data.reference` is the
        order id handed to the provider when the OXXO voucher / SPEI transfer was issued, so the
        handler can find the order and confirm or fail it.
      required: [type, data]
      properties:
        type:
          type: string
          enum: [payment.confirmed, payment.failed]
        data:
          type: object
          required: [reference]
          properties:
            reference:
              type: string
              format: uuid
            charge_id:
              type: string
              description: The provider's settlement reference, when supplied.

    PaymentWebhookAck:
      type: object
      description: >
        Terse acknowledgement of a processed payment webhook (COM-206): confirms receipt and echoes
        the referenced order's id and resulting status, without leaking any other order detail.
      required: [received, orderId, status]
      properties:
        received:
          type: boolean
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, preparing, in_transit, delivered, cancelled]

    KitchenWebhookEvent:
      type: object
      description: >
        A dark kitchen's asynchronous status webhook (COM-303). `data.reference` is the order id
        handed to the kitchen on the routing ticket when the order was confirmed, so the handler can
        find the order and advance its fulfilment state.
      required: [type, data]
      properties:
        type:
          type: string
          enum: [kitchen.preparing, kitchen.dispatched]
        data:
          type: object
          required: [reference]
          properties:
            reference:
              type: string
              format: uuid

    KitchenWebhookAck:
      type: object
      description: >
        Terse acknowledgement of a processed kitchen webhook (COM-303): confirms receipt and echoes
        the referenced order's id and resulting status, without leaking any other order detail.
      required: [received, orderId, status]
      properties:
        received:
          type: boolean
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, preparing, in_transit, delivered, cancelled]

    OrderItemResponse:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          $ref: '#/components/schemas/MoneyResponse'
        lineTotal:
          $ref: '#/components/schemas/MoneyResponse'

    GrocerySearchRequest:
      type: object
      required: [items, zipCode]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              ingredient:
                type: string
              quantity:
                type: number
              unit:
                type: string
        providers:
          type: array
          items:
            type: string
        zipCode:
          type: string

    AvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
        zipCode:
          type: string
        timeSlots:
          type: array
          items:
            type: string

    MoneyResponse:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
          default: MXN
        formatted:
          type: string

    ProviderResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [dark_kitchen, grocery]
        logoUrl:
          type: string
          format: uri
        estimatedDelivery:
          type: string

    Problem:
      type: object
      description: |
        RFC 7807 problem detail returned as `application/problem+json` for every 4xx/5xx
        error (COM-108). Additional members (e.g. `errors` for validation failures) may be present.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type (`about:blank` by default)
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
        instance:
          type: string
          description: A URI reference identifying the specific occurrence (the request path)
