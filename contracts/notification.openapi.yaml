openapi: 3.0.3
info:
  title: NutriPlan Notification API
  version: 1.0.0
  description: |
    The in-app notification feed for the NutriPlan Notification bounded context (NTF-105).

    Notifications are produced by consuming domain events from other services, never by
    clients; this API is read-mostly, exposing the feed, its unread badge count, and the
    single state change a user can make -- marking one read.

    The feed is a **rolling window, not an archive**. Entries age out after the configured
    retention period (30 days by default) and each user's feed is capped, so a notification
    listed last month may legitimately no longer exist. Clients should treat a `404` on
    mark-read as an ordinary outcome rather than an error condition.

    Every operation is scoped to the authenticated caller, taken from the access token's
    `sub` claim. There is no parameter anywhere in this API for addressing another user's
    notifications.
  contact:
    name: NutriPlan Team
    url: https://github.com/epr-ds/nutriplan
  license:
    name: Proprietary
    url: https://github.com/epr-ds/nutriplan/blob/main/LICENSE
servers:
  - url: https://api.nutriplan.app/notifications/v1
    description: Production
  - url: http://localhost:8084
    description: Local development
tags:
  - name: Notifications
    description: The in-app feed, its badge count, and read-state.
  - name: health
    description: Liveness and readiness probes for orchestration.

paths:
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the current user's notifications
      description: >-
        Returns one page of the caller's notifications, newest first, together with the
        unread badge count. Use `hasMore` to decide whether to request the next page: a page
        may come back shorter than `limit` when entries expired since they were indexed, so a
        full page is not a reliable signal on its own.
      security:
        - BearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          required: false
          description: >-
            Page the unread index instead of the whole feed. Does not affect `unreadCount`,
            which is always the badge for the whole feed.
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Capped so a single request cannot materialize a user's entire
            retained feed on the shared datastore.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of the caller's feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: Count the current user's unread notifications
      description: >-
        Returns the unread badge count on its own. Separate from the feed because the badge
        is needed far more often than the list (launch, resume, push receipt) and reading a
        page to count it would transfer records nobody is going to look at. Only
        notifications still inside the retention window are counted.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's unread notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      description: >-
        Marks one of the caller's notifications read and returns its updated state. The
        operation is idempotent: repeating it succeeds and leaves the original `readAt`
        untouched, so a double-tap in the app is harmless.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: The notification, now read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notifications/preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Get the current user's notification preferences
      description: >-
        Returns the caller's **complete** preference matrix: every notification type this API
        knows about, in a stable order, with a switch per channel. A user who has never saved
        anything gets the defaults -- everything enabled, no quiet hours -- rather than a
        `404`; they do have preferences, they simply have not changed any.


        The full matrix is returned rather than only the exceptions so a client can render a
        settings screen without knowing the catalogue in advance, and so a type added after
        the client shipped is visibly present and on.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Notifications]
      operationId: replaceNotificationPreferences
      summary: Replace the current user's notification preferences
      description: >-
        Replaces the caller's preferences wholesale. This is deliberately **not** a patch: a
        partial update of a matrix whose rows the client may not know about is ambiguous in a
        way the request cannot resolve, since an omitted row could equally mean "leave it
        alone" or "reset it". So a type absent from `types` returns to its default (enabled on
        every channel), and a `quietHours` of `null` clears the window.


        Listing the same type twice is rejected with `422` rather than resolved last-wins: two
        rows for one type carry two different answers to the same question, and honouring
        either one silently would leave the user looking at a screen that disagrees with what
        was saved.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: The preferences as they are now stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: The service process is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Reports whether the service can serve notification traffic, listing every dependency
        check so operators can see *why* it is (not) ready without scraping logs.
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A required dependency is unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication is required, or the bearer token is missing/invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        The notification does not exist, has aged out of the retention window, or belongs to
        a different user. All three are deliberately reported identically so the endpoint
        cannot be used to discover other users' notification ids.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: >-
        The request was well-formed but failed validation or a domain precondition.
        Validation failures additionally carry a machine-readable `errors` array.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    NotificationType:
      type: string
      description: >-
        What happened, from the user's point of view. The `order_*` members mirror the
        newsworthy states of an order's lifecycle one-for-one.
      enum:
        - order_confirmed
        - order_preparing
        - order_in_transit
        - order_delivered
        - order_cancelled
        - meal_reminder
        - plan_ending

    NotificationChannel:
      type: string
      description: >-
        Where the notification was meant to surface. `in_app` is this durable feed; `push` is
        the best-effort nudge handed to FCM/APNs. They are independent.
      enum: [in_app, push]

    DeliveryStatus:
      type: string
      description: >-
        How far the notification got on its way to the user. This tracks *delivery*, not
        whether it has been read -- `readAt` moves independently. `suppressed` means a
        preference or quiet-hours window deliberately withheld it, which is not a failure.
      enum: [pending, sent, delivered, failed, suppressed]

    Notification:
      type: object
      required: [id, type, payload, channels, status, createdAt, isRead]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        payload:
          type: object
          additionalProperties: true
          description: >-
            Type-specific detail for rendering (order id, meal name, and so on). JSON-native
            values only; the domain refuses to store anything it cannot round-trip.
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NotificationChannel'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        createdAt:
          type: string
          format: date-time
          description: When the notification was raised. The feed is ordered by this, newest first.
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the user first read it; `null` while unread. Never moves once set.
        isRead:
          type: boolean
          description: Stated outright rather than left for the client to derive from `readAt`.

    NotificationPage:
      type: object
      required: [items, page, limit, unreadCount, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        unreadCount:
          type: integer
          minimum: 0
          description: >-
            The badge count for the whole feed, taken alongside this page. It is a snapshot,
            not a total of `items`, and is unaffected by `unreadOnly`.
        hasMore:
          type: boolean
          description: Whether at least one further notification exists after this page.

    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0

    QuietHours:
      type: object
      description: >-
        A recurring nightly window, in the user's own local time, during which **push is
        withheld**. In-app entries are unaffected: the feed is pull-based and silent, so
        holding one back overnight would spare the user nothing and would either surface it
        out of order in the morning or lose it outright.


        The window is half-open, `[start, end)`, and wrapping past midnight is the normal
        case: `22:00`-`07:00` is one window, not two. `start` equal to `end` is rejected,
        since it reads equally well as "no window" and "all day".
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '22:00'
          description: >-
            Local wall-clock time, `HH:MM`, 24-hour. Deliberately not `format: time`, which is
            RFC 3339 `full-time` and requires an offset -- the one thing this field must not
            carry.
        end:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '07:00'
          description: Local wall-clock time, `HH:MM`, 24-hour. Exclusive.
        timeZone:
          type: string
          default: America/Mexico_City
          example: America/Mexico_City
          description: >-
            IANA zone **name**, never a fixed offset. The name is what keeps the window
            meaning "ten at night" across a daylight-saving change; an offset would quietly
            shift it by an hour twice a year. An unknown zone is a `422`.

    TypePreference:
      type: object
      description: One row of the preference matrix -- a notification type and its channel switches.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        inApp:
          type: boolean
          default: true
          description: Whether this type appears in the in-app feed.
        push:
          type: boolean
          default: true
          description: >-
            Whether this type may be pushed. A push still requires the moment to fall outside
            `quietHours`.

    NotificationPreferences:
      type: object
      description: >-
        A user's complete preference matrix. `types` is an **array of rows**, not an object
        keyed by type: a map could only be described as free-form `additionalProperties`, so
        no generated client would get a typed accessor or an exhaustive switch, and key order
        would not be guaranteed. Rows arrive in `NotificationType` declaration order.
      required: [types, updatedAt]
      properties:
        types:
          type: array
          description: >-
            Every notification type this API knows about, whether or not the user has ever
            changed it -- so a client can render the settings screen without knowing the
            catalogue in advance.
          items:
            $ref: '#/components/schemas/TypePreference'
        quietHours:
          allOf:
            - $ref: '#/components/schemas/QuietHours'
          nullable: true
          description: The nightly push-suppression window, or `null` when none is set.
        updatedAt:
          type: string
          format: date-time
          description: When these preferences were last replaced.

    UpdateNotificationPreferencesRequest:
      type: object
      description: >-
        A full replacement of the caller's preferences. A type omitted from `types` returns to
        its default (enabled on every channel); a `quietHours` of `null` clears the window.
      required: [types]
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/TypePreference'
        quietHours:
          allOf:
            - $ref: '#/components/schemas/QuietHours'
          nullable: true

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string
              detail:
                type: string
                nullable: true

    Problem:
      type: object
      description: RFC 7807 problem document.
      required: [type, title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Present on request-validation failures.
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
